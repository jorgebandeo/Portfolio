<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Projetos de software, web e hardware de Jorge Bandeo.">
    <title>Jorge Bandeo — Projetos</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="project-loader.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <header>
        <canvas id="rainCanvasHeader" aria-hidden="true"></canvas>
        <div class="header-content">
            <p class="eyebrow">LCARS // Project Database</p>
            <h1>Projetos</h1>
            <p>Web · Software · Hardware · Pesquisa · Integração</p>
        </div>
    </header>

    <nav aria-label="Navegação principal">
        <a href="index.html">Sobre</a>
        <a href="projetos.html">Projetos</a>
        <a href="experiencia.html">Experiência</a>
        <a href="contato.html">Contato</a>
    </nav>

    <main class="container">
        <section id="projects" class="projects">
            <h2>Projetos</h2>
            <p class="project-counter" aria-live="polite"></p>
            <p class="lcars-label">AUTO CATALOG // repositórios públicos são analisados e compilados automaticamente</p>

            <div class="filtos" aria-label="Filtros de projetos">
                <button class="filter-button" type="button" data-category="web" aria-pressed="false" onclick="toggleFilter(this)">
                    <img src="image/designer-de-web.png" alt="" aria-hidden="true"> Web
                </button>
                <button class="filter-button" type="button" data-category="software" aria-pressed="false" onclick="toggleFilter(this)">
                    <img src="image/sofware.png" alt="" aria-hidden="true"> Software
                </button>
                <button class="filter-button" type="button" data-category="hardware" aria-pressed="false" onclick="toggleFilter(this)">
                    <img src="image/lasca.png" alt="" aria-hidden="true"> Hardware
                </button>
            </div>

            <div class="project-grid"></div>
        </section>
    </main>

    <footer>
        <canvas id="rainCanvasFooter" aria-hidden="true"></canvas>
        <p>&copy; 2026 Jorge Bandeo · Project database // LCARS interface</p>
    </footer>

    <script src="script.js"></script>
    <script src="project-loader.js"></script>
</body>
</html>
