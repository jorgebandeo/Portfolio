name: Build portfolio catalog

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
  push:
    branches: [ main ]
    paths:
      - 'data/projects.json'
      - 'scripts/build_portfolio_catalog.py'
      - '.github/workflows/build-portfolio-catalog.yml'

permissions:
  contents: write

concurrency:
  group: portfolio-catalog-main
  cancel-in-progress: false

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Sync with latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Compile public repositories
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build_portfolio_catalog.py

      - name: Commit generated catalog
        id: catalog_commit
        run: |
          if git diff --quiet -- data/projects.generated.json; then
            echo "Catalog unchanged"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/projects.generated.json
          git commit -m "chore: rebuild portfolio project catalog"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Publish generated catalog safely
        if: steps.catalog_commit.outputs.changed == 'true'
        run: |
          for attempt in 1 2 3; do
            echo "Publish attempt ${attempt}/3"
            git fetch origin main

            if ! git rebase origin/main; then
              echo "Rebase conflict while publishing generated catalog"
              git rebase --abort || true
              exit 1
            fi

            if git push origin HEAD:main; then
              echo "Catalog published successfully"
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "Remote main advanced during push; retrying..."
              sleep $((attempt * 2))
            fi
          done

          echo "Unable to publish catalog after 3 attempts"
          exit 1
