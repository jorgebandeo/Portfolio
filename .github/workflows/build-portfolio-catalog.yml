name: Build portfolio catalog

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
  push:
    branches: [ main ]
    paths:
      - 'data/projects.json'
      - 'scripts/build_portfolio_catalog.py'
      - '.github/workflows/build-portfolio-catalog.yml'

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile public repositories
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build_portfolio_catalog.py
      - name: Commit generated catalog
        run: |
          if git diff --quiet -- data/projects.generated.json; then
            echo "Catalog unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/projects.generated.json
          git commit -m "chore: rebuild portfolio project catalog"
          git push
